<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#10302a" stroke-width="1"/>
    </pattern>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#0d3324"/>
      <stop offset="1" stop-color="#081818" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="180" height="180" fill="#081818"/>
  <rect width="180" height="180" fill="url(#grid)" opacity="0.55"/>
  <circle cx="90" cy="90" r="70" fill="url(#halo)"/>
  <g filter="url(#glow)" fill="none" stroke="#5ef08a" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="90" cy="90" r="58"/>
    <rect x="56" y="64" width="68" height="52" rx="7"/>
    <path d="M56 77H124" stroke-width="4.5"/>
    <path d="M68 88L82 96.5L68 105Z" fill="#5ef08a" stroke-width="3.5"/>
  </g>
  <g fill="none" stroke="#b6ffcb" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity="0.7">
    <circle cx="90" cy="90" r="58"/>
    <rect x="56" y="64" width="68" height="52" rx="7"/>
  </g>
</svg>
